<!-- 404.html — place at the REPO ROOT, not inside the quranreel folder -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages serves this file for any unmatched path.
    // If the path looks like our verse deep link, redirect to the real page.
    const path = window.location.pathname;
    if (path.startsWith('/quranreel/verse/')) {
      window.location.replace(
        'https://shamehthi96-ux.github.io/quranreel/verse/index.html' +
        '?v=' + path.split('/').pop()
      );
    }
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
<script>
  const params = new URLSearchParams(window.location.search);
  const verseId = params.get('v');
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('deep-link').href =
      'https://shamehthi96-ux.github.io/quranreel/verse/' + verseId;
  });
</script>
