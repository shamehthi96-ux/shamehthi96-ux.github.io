<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quran Reel — Verse</title>
</head>
<body>
  <p>Opening verse… if nothing happens, <a id="deep-link" href="#">tap here</a>.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const verseId = params.get('v');
    document.addEventListener('DOMContentLoaded', () => {
      if (verseId) {
        document.getElementById('deep-link').href =
          'https://shamehthi96-ux.github.io/quranreel/verse/' + verseId;
        // Uncomment the next line if you want it to redirect automatically
        // instead of waiting for a tap:
        // window.location.replace(document.getElementById('deep-link').href);
      }
    });
  </script>
</body>
</html>
